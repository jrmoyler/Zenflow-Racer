<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ZenFlow responsive review</title><style>body{margin:20px;background:#0c1728;color:#e8f8ff;font:15px system-ui}button{padding:12px;margin:0 8px 16px 0}iframe{display:block;border:1px solid #50dde0;background:#102339;max-width:100%}p{max-width:800px}</style><h1>Responsive playtest</h1><p>Real game in fixed CSS viewports. Enable Touch controls in Character Select. This checks responsive layout and pointer input, not physical-device performance.</p><button data-size="390,844">Phone portrait · 390 × 844</button><button data-size="844,390">Phone landscape · 844 × 390</button><button data-size="1024,768">Tablet · 1024 × 768</button><iframe title="Game viewport" src="index.html" width="390" height="844" allow="fullscreen; gamepad"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const [w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h;}));</script></html>
